name: benchmark

on:
  repository_dispatch:
    types: [algos-changed]

  workflow_dispatch:
    inputs:
      instance_set:
        description: "Instance set to run"
        required: true
        default: "FoodmartDataTest"
        type: choice
        options:
          - FoodmartDataTest
          - FoodmartData
          - SPRP
          - SPRP-SS
          - BahceciOencan
          - MuterOencan
          - HennWaescherUniform
          - HennWaescherClassBased
          - KrisSmallDataCorrected
          - KrisLargeData
          - all

      sample_size:
        description: "Representative instances per set"
        required: true
        default: "20"
        type: choice
        options:
          - "20"
          - "100"

      update_cache:
        description: "Upload updated Luigi cache"
        required: true
        default: false
        type: boolean

      deploy_site:
        description: "Deploy benchmark website"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      instance_sets: ${{ steps.matrix.outputs.instance_sets }}
      sample_id: ${{ steps.sample.outputs.id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Resolve the upstream algorithm revision once
        env:
          ALGOS_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [ -n "$ALGOS_SHA" ]; then
            uv add --no-sync --rev "$ALGOS_SHA" \
              "git+https://github.com/kit-dsm/ware_ops_algos.git"
          else
            uv lock --upgrade-package ware_ops_algos
          fi

      - name: Share the resolved lockfile with all jobs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-lock
          path: |
            pyproject.toml
            uv.lock
          retention-days: 1
          compression-level: 0

      - name: Ensure cache release exists
        if: ${{ github.event_name == 'repository_dispatch' || inputs.update_cache }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view benchmark-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create benchmark-cache \
            --repo "$GITHUB_REPOSITORY" \
            --title "Benchmark cache" \
            --notes "Rolling cohort-versioned Luigi cache. Managed by the benchmark workflow."

      - name: Identify benchmark cohort
        id: sample
        run: echo "id=$(sha256sum experiments/benchmark_samples.json | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - id: matrix
        env:
          INSTANCE_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.instance_set || 'all' }}
          SAMPLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_size || '100' }}
        run: |
          python - <<'PY'
          import json
          import os

          production_sets = [
              {"set": "FoodmartData", "runner": "foodmart"},

              {"set": "SPRP", "runner": "hessler"},
              {"set": "SPRP-SS", "runner": "hessler"},
              {"set": "BahceciOencan", "runner": "hessler"},
              {"set": "MuterOencan", "runner": "hessler"},
              {"set": "HennWaescherUniform", "runner": "hessler"},
              {"set": "HennWaescherClassBased", "runner": "hessler"},

              {"set": "KrisSmallDataCorrected", "runner": "ibrsp"},
          ]

          test_sets = [
              {"set": "FoodmartDataTest", "runner": "foodmart_test"},
          ]

          manual_only_sets = [
              {"set": "KrisLargeData", "runner": "ibrsp"},
          ]

          selected = os.environ["INSTANCE_SET"]
          sample_size = int(os.environ["SAMPLE_SIZE"])
          selectable_sets = production_sets + test_sets + manual_only_sets

          if selected == "all":
              selected_sets = production_sets
          else:
              selected_sets = [x for x in selectable_sets if x["set"] == selected]

          if not selected_sets:
              raise SystemExit(f"Unknown instance set: {selected}")

          # Keep approximately ten selected instances in each job. The fixed
          # cohort makes these shards comparable across algorithm revisions.
          matrix = []
          for item in selected_sets:
              shard_count = (
                  1
                  if item["runner"] == "foodmart_test"
                  else max(1, (sample_size + 9) // 10)
              )
              for shard_index in range(shard_count):
                  matrix.append({
                      **item,
                      "shard": shard_index,
                      "shards": shard_count,
                  })

          print(json.dumps(matrix, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("matrix=" + json.dumps(matrix) + "\n")
              f.write(
                  "instance_sets="
                  + json.dumps([item["set"] for item in selected_sets])
                  + "\n"
              )
          PY

  benchmark:
    needs: prepare

    runs-on: ubuntu-latest
    timeout-minutes: 330

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download resolved lockfile
        uses: actions/download-artifact@v4
        with:
          name: benchmark-lock
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --no-dev

      - name: Restore Luigi cache
        env:
          SET_NAME: ${{ matrix.set }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shards }}
          SAMPLE_ID: ${{ needs.prepare.outputs.sample_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p experiments/output cache_in

          SHARD_ID="${SHARD_INDEX}-of-${SHARD_COUNT}"

          CACHE_NAME="cache__${SET_NAME}__${SAMPLE_ID}__${SHARD_ID}.tar.gz"

          gh release download benchmark-cache \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CACHE_NAME" \
            --dir cache_in \
            --clobber || echo "cold cache for ${SET_NAME}"

          if [ -f "cache_in/${CACHE_NAME}" ]; then
            tar xzf "cache_in/${CACHE_NAME}" -C experiments/output
          fi

      - name: Run benchmark shard
        env:
          SET_NAME: ${{ matrix.set }}
          RUNNER_KIND: ${{ matrix.runner }}
          BENCHMARK_SHARD_INDEX: ${{ matrix.shard }}
          BENCHMARK_SHARD_COUNT: ${{ matrix.shards }}
          BENCHMARK_SAMPLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_size || '100' }}
          BENCHMARK_REQUIRE_SAMPLE_MANIFEST: "true"
          LUIGI_WORKERS: "2"
        run: |
          case "$RUNNER_KIND" in
            foodmart)
              uv run python experiments/run_foodmart.py "$SET_NAME"
              ;;
            
            foodmart_test)
              uv run python experiments/run_foodmart_test.py "$SET_NAME"
              ;;

            hessler)
              uv run python experiments/run_hessler_irnich.py "$SET_NAME"
              ;;

            ibrsp)
              uv run python experiments/run_ibrsp.py "$SET_NAME"
              ;;

            *)
              echo "Unknown runner kind: $RUNNER_KIND"
              exit 1
              ;;
          esac

      - name: Pack updated Luigi cache shard
        env:
          SET_NAME: ${{ matrix.set }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shards }}
          SAMPLE_ID: ${{ needs.prepare.outputs.sample_id }}
        run: |
          items=("$SET_NAME")

          if [ -d "experiments/output/_data_cache" ]; then
            items+=("_data_cache")
          fi

          SHARD_ID="${SHARD_INDEX}-of-${SHARD_COUNT}"
          CACHE_NAME="cache__${SET_NAME}__${SAMPLE_ID}__${SHARD_ID}.tar.gz"
          tar -I 'gzip -1' -cf "$CACHE_NAME" \
            -C experiments/output "${items[@]}"

      - name: Upload updated Luigi cache shard
        if: ${{ github.event_name == 'repository_dispatch' || inputs.update_cache }}
        env:
          SET_NAME: ${{ matrix.set }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shards }}
          SAMPLE_ID: ${{ needs.prepare.outputs.sample_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHARD_ID="${SHARD_INDEX}-of-${SHARD_COUNT}"
          CACHE_NAME="cache__${SET_NAME}__${SAMPLE_ID}__${SHARD_ID}.tar.gz"

          gh release upload benchmark-cache \
            "$CACHE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Pack output shard for collector
        env:
          SET_NAME: ${{ matrix.set }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ matrix.shards }}
        run: |
          SHARD_ID="${SHARD_INDEX}-of-${SHARD_COUNT}"
          tar -I 'gzip -1' -cf "output-${SET_NAME}-${SHARD_ID}.tar.gz" \
            -C experiments/output "$SET_NAME"

      - name: Upload output shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.set }}-${{ matrix.shard }}
          path: output-${{ matrix.set }}-${{ matrix.shard }}-of-${{ matrix.shards }}.tar.gz
          retention-days: 7
          compression-level: 0

  build-site:
    needs: [prepare, benchmark]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download resolved lockfile
        uses: actions/download-artifact@v4
        with:
          name: benchmark-lock
          path: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --extra eval --no-dev

      - name: Restore previously published result history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous-results/download previous-results/extracted
          gh release download benchmark-results \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "benchmark-results.parquet" \
            --dir previous-results/download \
            --clobber || true

          if [ ! -f previous-results/download/benchmark-results.parquet ]; then
            gh release download benchmark-results \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "benchmark-results.tar.gz" \
              --dir previous-results/download \
              --clobber || true
          fi
          if [ -f previous-results/download/benchmark-results.tar.gz ]; then
            tar xzf previous-results/download/benchmark-results.tar.gz \
              -C previous-results/extracted
          fi

      - name: Download output shards
        uses: actions/download-artifact@v4
        with:
          pattern: output-*
          path: run_outputs

      - name: Restore output shards
        run: |
          mkdir -p experiments/output
          find run_outputs -name "output-*.tar.gz" -print -exec tar xzf {} -C experiments/output \;

      - name: Build result dataframe
        env:
          INSTANCE_SETS: ${{ needs.prepare.outputs.instance_sets }}
          SAMPLE_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_size || '100' }}
        run: |
          uv run --frozen python -m ware_ops_pipes.benchmark_results.cli build-results \
            --instance-sets-json "$INSTANCE_SETS" \
            --sample-size "$SAMPLE_SIZE" \
            --history-parquet previous-results/download/benchmark-results.parquet \
            --legacy-pickle previous-results/extracted/df_results.pkl \
            --output benchmark-results.parquet

      - name: Build website data
        run: uv run --frozen python -m ware_ops_pipes.benchmark_results.cli build-site --input benchmark-results.parquet --output site/data

      - name: Upload Parquet run artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-parquet
          path: benchmark-results.parquet
          retention-days: 30

      - name: Ensure result release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view benchmark-results --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create benchmark-results \
            --repo "$GITHUB_REPOSITORY" \
            --title "Benchmark results" \
            --notes "Latest benchmark result data."

      - name: Upload benchmark result asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload benchmark-results \
            benchmark-results.parquet \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Prune superseded cache assets for completed sets
        if: ${{ github.event_name == 'repository_dispatch' || inputs.update_cache }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTANCE_SETS: ${{ needs.prepare.outputs.instance_sets }}
          SAMPLE_ID: ${{ needs.prepare.outputs.sample_id }}
        run: |
          uv run python experiments/prune_release_assets.py \
            --repo "$GITHUB_REPOSITORY" \
            --sample-id "$SAMPLE_ID" \
            --instance-sets-json "$INSTANCE_SETS"

          uv run python experiments/prune_release_assets.py \
            --repo "$GITHUB_REPOSITORY" \
            --release cache \
            --sample-id "$SAMPLE_ID" \
            --instance-sets-json "$INSTANCE_SETS" \
            --missing-ok

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'repository_dispatch' || inputs.deploy_site }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build-site
    if: ${{ github.event_name == 'repository_dispatch' || inputs.deploy_site }}

    runs-on: ubuntu-latest

    concurrency:
      group: benchmark-pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
