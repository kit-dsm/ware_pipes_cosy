name: deploy-benchmark-site-only

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: |
          uv sync --extra eval

      - name: Restore latest benchmark dataframe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tmp_benchmark_results/download tmp_benchmark_results/extracted

          gh release download benchmark-results \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "benchmark-results.tar.gz" \
            --dir tmp_benchmark_results/download \
            --clobber

          tar xzf tmp_benchmark_results/download/benchmark-results.tar.gz \
            -C tmp_benchmark_results/extracted

          mkdir -p experiments/evaluation

          cp tmp_benchmark_results/extracted/df_results.pkl \
            experiments/evaluation/df_results.pkl

      - name: Rebuild benchmark website data
        run: |
          rm -rf experiments/evaluation/website/site/data
          uv run python experiments/evaluation/website/build_site_data.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/evaluation/website/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4