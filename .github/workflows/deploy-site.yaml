name: deploy-benchmark-site-only

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen --extra eval --no-dev

      - name: Download latest benchmark results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download benchmark-results \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "benchmark-results.parquet" \
            --dir . \
            --clobber || true
          if [ -f benchmark-results.parquet ]; then
            echo "RESULTS_INPUT=benchmark-results.parquet" >> "$GITHUB_ENV"
          else
            mkdir -p previous-results
            gh release download benchmark-results \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "benchmark-results.tar.gz" \
              --dir previous-results \
              --clobber
            tar xzf previous-results/benchmark-results.tar.gz \
              -C previous-results
            echo "RESULTS_INPUT=previous-results/df_results.pkl" >> "$GITHUB_ENV"
          fi

      - name: Rebuild benchmark website data
        run: uv run --frozen python -m ware_ops_pipes.benchmark_results.cli build-site --input "$RESULTS_INPUT" --output site/data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
